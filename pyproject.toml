[project]
name = "earlywarning"
version = "0.1.0"
description = "Prédiction du risque de décrochage universitaire"
readme = "README.md"
authors = [
    { name = "nathp94", email = "nathan.pege@efrei.net" }
]
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.25.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[project.scripts]
earlywarning = "earlywarning:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openai>=3.24.0",
]
